<!doctype html>
<!-- planwatch-offline -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7052b4" />
    <title>Offline · PlanWatch</title>
    <script>
      let preference;
      try { preference = localStorage.getItem('planwatch:theme'); } catch {}
      document.documentElement.dataset.theme = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    </script>
    <style>
      :root{color-scheme:light;--bg:#f8f9fc;--surface:#fff;--text:#2d2938;--muted:#706879;--border:#ddd9e7}
      :root[data-theme=dark]{color-scheme:dark;--bg:#12141c;--surface:#1b1d29;--text:#eeeaf6;--muted:#b2abc2;--border:#393647}
      *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px;padding-bottom:max(24px,env(safe-area-inset-bottom))}main{max-width:440px;padding:36px;background:var(--surface);border:1px solid var(--border);border-radius:18px}img{border-radius:16px;width:64px;height:64px}h1{font-size:28px;line-height:1.2;letter-spacing:-.7px;margin:25px 0 14px}p{color:var(--muted);margin:0 0 26px}a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:8px 20px;color:#fff;background:#7052b4;border-radius:9px;text-decoration:none;font-weight:550}a:focus-visible{outline:3px solid #b59be9;outline-offset:4px}
    </style>
  </head>
  <body><main><img src="/icons/app-192.png" alt="" /><h1>A moment to reconnect.</h1><p>PlanWatch needs a connection to load and save tasks. Reconnect, then try again.</p><a href="/">Try again</a></main></body>
</html>
