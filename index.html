<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem('planwatch:theme'); } catch {}
        document.documentElement.dataset.theme = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta name="description" content="A calmer place for your tasks and what matters next." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PlanWatch" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/app.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-180.png" />
    <title>PlanWatch</title>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
