name: PlanWatch 2.0 checks and preview

on:
  push:
    branches: [PlanWatch2.0]
  pull_request:
    branches: [PlanWatch2.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planwatch-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Type checks, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check

  deploy:
    name: Deploy separate Pages frontend and Worker API
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/PlanWatch2.0' && vars.PLANWATCH_PREVIEW_CONFIG != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Prepare public deployment configuration
        run: npm run deploy:configure
        env:
          PLANWATCH_PREVIEW_CONFIG: ${{ vars.PLANWATCH_PREVIEW_CONFIG }}
      - run: npm run build
      - name: Check CI credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Add the CLOUDFLARE_API_TOKEN repository secret before deploying.'
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply numbered preview migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publish API Worker
        run: npx wrangler deploy --config wrangler.preview.jsonc --name planwatch-v2-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publish Pages frontend
        run: npm run deploy:pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify public assets and authentication boundary
        run: npm run deploy:check
