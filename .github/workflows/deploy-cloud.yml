name: Deploy Server Cloud

on:
  push:
    branches: [ main ]
    paths:
      - 'server-cloud/**'
      - '.github/workflows/deploy-cloud.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # <-- pour accéder à CF_API_TOKEN / CF_ACCOUNT_ID (environment secrets)
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers (Wrangler v4)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: server-cloud
          wranglerVersion: '4'        # <-- force v4
          command: deploy             # <-- pas de --env=
