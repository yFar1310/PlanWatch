name: Deploy Server Cloud

on:
  push:
    branches: [ main ]
    paths:
      - 'server-cloud/**'
      - '.github/workflows/deploy-cloud.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # <-- so it can read Environment secrets
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CF_API_TOKEN }}    # from your “production” env
          accountId: ${{ secrets.CF_ACCOUNT_ID }}   # same
          workingDirectory: server-cloud
          command: deploy --env=""                  # top-level env
